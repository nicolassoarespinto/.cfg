unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded.."


set -g allow-passthrough on
set -a terminal-features 'xterm-256color:RGB'
set -g default-terminal 'tmux-256color'
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'
set-environment -g COLORTERM "truecolor"

set -gu default-command /usr/bin/bash
set -g default-shell /usr/bin/bash

set -g base-index 1
setw -g pane-base-index 1

# set vi mode for copy mode
setw -g mode-keys vi
set -g status-keys vi


# automatically rename windows when an explicit name is not set
# set-window-option -g automatic-rename on
# set-option -g automatic-rename-format "#(tmux-smart-name '#{pane_current_command}' '#{pane_current_path}')"

set-option -g set-titles-string "#T - #W"


bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -n M-Left previous-window
bind -n M-Right next-window

# Root-ish table active only in the "herdr" session (see hook below).
# M-Left/M-Right are deliberately left unbound here: an unbound root-table
# key passes its raw escape sequence straight through to the pane instead
# of tmux acting on it, so herdr's own unprefixed alt+left/right tab-switch
# receives them instead of tmux's window-switch. The other two root-table
# binds (M-S-Left/Right, F6) are copied over so nothing else regresses
# while inside that session.
bind-key -T herdr-root -n M-S-Left swap-window -t -1
bind-key -T herdr-root -n M-S-Right swap-window -t +1
bind-key -T herdr-root -n F6 display-popup -E -w 80% -h 70% "ntm palette"

set-hook -g client-session-changed \
  'if -F "#{==:#{session_name},herdr}" "set-option key-table herdr-root; run-shell ~/.tmux/themes/herdr-status-subtle.sh" "set-option key-table root; run-shell \"~/.tmux/themes/herdr-status-subtle.sh --off\""'

bind E show-environment -g

## 
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %


# Screen-like bindings
# Kill window (like screen's C-a k)
bind k confirm-before -p "kill-window #W? (y/n)" kill-window

# Kill pane (like screen's C-a x)
bind x confirm-before -p "kill-pane #P? (y/n)" kill-pane

# Create new window (like screen's C-a c)
bind c new-window -c "#{pane_current_path}"

#Detach (like screen's C-a d)
bind d detach

# List windows (like screen's C-a ")
bind '"' choose-window

# Last window (like screen's C-a C-a)
bind C-a last-window

# Next/Previous window (like screen's C-a n/p)
bind n next-window
bind p previous-window

# Window list (like screen's C-a w)
bind w list-windows

# Rename window (like screen's C-a A)
bind A command-prompt -I "#W" "rename-window '%%'"

# Copy mode (like screen's C-a [)
bind [ copy-mode

# Paste buffer (like screen's C-a ])
bind ] paste-buffer

# Pane and window swapping
# Swap current pane with the next one
bind > swap-pane -D
# Swap current pane with the previous one
bind < swap-pane -U
# Swap current window with another (prompts for window number)
bind S command-prompt -p "swap window with:" "swap-window -t '%%'"
# Move current window to the left/right
bind-key -n M-S-Left swap-window -t -1
bind-key -n M-S-Right swap-window -t +1


set -s set-clipboard on



##### SESSIONIZER ####
# bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
# No TMUX_CALLING_CLIENT here: display-popup does NOT expand #{...} in its
# command string (unlike run-shell), so that would inject the literal,
# unexpanded text "#{client_name}" as the env var — a bogus override that
# beats the fallback query instead of being skipped. Not needed anyway: a
# popup is a real attached pane for the invoking client, so a plain
# `tmux display-message -p '#{client_name}'` from inside it already
# resolves correctly on its own (verified directly). The run-shell
# bindings below are the opposite case — genuinely detached jobs with no
# pane of their own, where that same in-script query resolves ambiguously
# (see the long comment in tmux-session-swap), so TMUX_CALLING_CLIENT is
# still required there.
bind f display-popup -E  "~/.local/bin/tmux-sessionizer"
bind-key -r N run-shell "~/.local/bin/tmux-sessionizer ~/dotfiles"
bind-key -r H run-shell "TMUX_CALLING_CLIENT='#{client_name}' ~/dotfiles/bin/tmux-session-swap herdr ~/dotfiles/herdr"

# Scratch REPL session, flips like herdr (swaps with whichever client
# already has it open, reflips back on a second press).
bind-key -r R run-shell "TMUX_CALLING_CLIENT='#{client_name}' ~/dotfiles/bin/tmux-session-swap repl"

# Worktree sessionizer - navigate git worktrees
bind-key w display-popup -E -w 90% -h 70% "~/dotfiles/bin/tmux-worktree-sessionizer"

# Zoxide sessionizer - navigate zoxide history
bind-key z display-popup -E -w 90% -h 70% "~/dotfiles/bin/tmux-zoxide-sessionizer"

# Claude tmux popup
bind-key C display-popup -E -w 80 -h 30 "/home/nicolas/.cargo/bin/claude-tmux"

# Lazydocker popup
bind-key D display-popup -E -w 90% -h 70% -d ~ "/home/nicolas/.local/bin/lazydocker"

# Claude dashboard - session switcher with Claude status
bind-key y display-popup -E -w 90% -h 50% "~/dotfiles/bin/claude-dashboard"

# Claude usage - live session/week quota + burn rate via ccusage
bind-key u display-popup -E -w 90% -h 70% -x R -y 0 "~/dotfiles/bin/claude-usage"

# Pane join/break — move panes between windows without killing processes
# J: pull any pane from anywhere into current window as a side-by-side split
# B: push current pane out to its own window (detach from split)
# z: zoom/unzoom current pane to full-screen (built-in, already works)
bind-key J display-popup -E -w 90% -h 70% "~/dotfiles/bin/tmux-pane-join"
bind-key B break-pane -d

bind-key -r G neww -n "git" -S lazygit


########################## 🔽 TPM 🔽 ###########################
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'


set -g @plugin 'sainnhe/tmux-fzf'
TMUX_FZF_OPTIONS="-p -w 80% -h 76% -m"
TMUX_FZF_LAUNCH_KEY="F"
lMUX_FZF_ORDER="session|pane|command|keybinding|window"
TMUX_FZF_PANE_FORMAT="#{p15:#{b:pane_current_path}} :: #{pane_current_command}"
# press <prefix-I> after add/delete plugin
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

########################## 🔼 TPM 🔼 ##########################

# Custom theme (fails gracefully if not present)
# Available: theme-kanagawa.sh, theme-gruvbox.sh, theme-claude.sh, theme-minimal.sh
run-shell "[ -f ~/.tmux/themes/theme-subtle.sh ] && ~/.tmux/themes/theme-subtle.sh || true"

# NTM Command Palette (added by 'ntm bind')
bind-key -n F6 display-popup -E -w 80% -h 70% "ntm palette"
